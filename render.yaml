services:
  - type: web
    name: cognivision-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: cognivision-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://cognivision-ai.onrender.com
      - key: GNANI_API_BASE_URL
        value: https://api.vachana.ai
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_TIMEOUT_MS
        value: 15000

  - type: web
    name: neulens-ai
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: ALLOWED_ORIGINS
        value: https://cognivision-ai.onrender.com
      - key: GNANI_API_KEY
        sync: false
      - key: ENABLE_MODEL_INFERENCE
        value: false

databases:
  - name: cognivision-db
    databaseName: cognivision
    user: cognivision
    plan: free
    region: oregon

